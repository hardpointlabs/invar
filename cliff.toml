# git-cliff configuration for release notes and CHANGELOG.md.
# https://git-cliff.org/docs/configuration
[changelog]
# Empty header: `git cliff --prepend CHANGELOG.md` inserts each release's
# section above the existing entries without repeating a file header.
header = ""
body = """
{% if version -%}
# [{{ version | trim_start_matches(pat="v") }}]\
{% if previous.version %}(https://github.com/hardpointlabs/invar/compare/{{ previous.version }}...{{ version }}){% endif %} \
({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
# Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first | split(pat="\n") | first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/hardpointlabs/invar/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance Improvements" },
  { message = "^revert", group = "Reverts" },
  { message = "^(docs|test|ci|build|chore|style|refactor)", skip = true },
]
