version: 2

project_name: invar

builds:
  - id: invar
    builder: rust
    binary: invar
    # The workspace has multiple members, so cargo needs the package flag.
    flags:
      - --release
      - -p=invar
    # glibc 2.31 (Ubuntu 20.04 / Debian 11) is the oldest runtime supported;
    # cargo-zigbuild builds against that ABI regardless of the build host.
    targets:
      - x86_64-unknown-linux-gnu.2.31
      - aarch64-unknown-linux-gnu.2.31
      - aarch64-apple-darwin
    env:
      - INVAR_VERSION={{ .Version }}
      - INVAR_COMMIT={{ .Commit }}

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

dockers_v2:
  - id: default
    ids: [invar]
    dockerfile: Dockerfile
    images:
      - ghcr.io/hardpointlabs/invar
      - docker.io/hardpointlabs/invar
    tags:
      - "{{.Tag}}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - invar
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"

announce:
  discord:
    enabled: '{{ isEnvSet "DISCORD_WEBHOOK_ID" }}'
    message_template: "**invar {{ .Tag }}** is out!\n\n{{ .ReleaseURL }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
