version: 2

project_name: invar

builds:
  - id: invar
    builder: rust
    binary: invar
    # The workspace has multiple members, so cargo needs the package flag.
    flags:
      - --release
      - -p=invar
    # glibc 2.31 (Ubuntu 20.04 / Debian 11) is the oldest runtime supported;
    # cargo-zigbuild builds against that ABI regardless of the build host.
    targets:
      - x86_64-unknown-linux-gnu.2.31
      - aarch64-unknown-linux-gnu.2.31
    env:
      - INVAR_VERSION={{ .Version }}
      - INVAR_COMMIT={{ .Commit }}

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

dockers_v2:
  - id: default
    ids: [invar]
    dockerfile: Dockerfile
    images:
      - ghcr.io/hardpointlabs/invar
    tags:
      - "{{.Tag}}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
