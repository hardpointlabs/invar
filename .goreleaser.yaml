version: 2

project_name: invar

builds:
  - id: invar
    binary: invar
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    tags:
      - slatedb
    env:
      - CGO_ENABLED=1
      - 'CC={{ if eq .Arch "arm64" }}aarch64-linux-gnu-gcc{{ else }}gcc{{ end }}'
      - >-
        CGO_LDFLAGS=-L .build/slatedb/target/{{ if eq .Arch "arm64" }}aarch64-unknown-linux-gnu/{{ end }}release
    # The $ORIGIN rpath lives in ldflags rather than env: goreleaser runs
    # os.ExpandEnv over build env values, which would strip $ORIGIN, while
    # ldflags only pass through the Go template engine.
    ldflags:
      - -X github.com/hardpointlabs/invar/config.Version={{ .Version }}
      - -X github.com/hardpointlabs/invar/config.Commit={{ .Commit }}
      - -extldflags=-Wl,-rpath,$ORIGIN

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - src: >-
          .build/slatedb/target/{{ if eq .Arch "arm64" }}aarch64-unknown-linux-gnu/{{ end }}release/libslatedb_uniffi.so
        dst: libslatedb_uniffi.so

dockers_v2:
  - id: default
    ids: [invar]
    dockerfile: Dockerfile
    images:
      - ghcr.io/hardpointlabs/invar
    tags:
      - "{{.Tag}}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - .build/goreleaser/libslatedb_uniffi-amd64.so
      - .build/goreleaser/libslatedb_uniffi-arm64.so

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
