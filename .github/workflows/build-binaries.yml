name: build-binaries

# Manually-triggered, lightweight build of the invar binaries (no GoReleaser,
# Zig or Docker). Produces one tar.gz artifact per target, then packages the
# two Linux binaries into a multi-arch OCI image pushed to GHCR and Docker Hub.
# The image is built with max-mode provenance and an SBOM, and signed keylessly
# with Cosign. Versioning is out of scope; images are tagged by commit SHA only.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  INVAR_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: blacksmith-4vcpu-ubuntu-2204
            archive: Linux_x86_64
          - target: aarch64-unknown-linux-gnu
            runner: blacksmith-4vcpu-ubuntu-2204-arm
            archive: Linux_arm64
          - target: aarch64-apple-darwin
            runner: blacksmith-6vcpu-macos-latest
            archive: Darwin_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: useblacksmith/checkout@v1
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false # use Blacksmith's caching instead
      - name: Sticky disk - cargo registry
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-cargo-registry-${{ matrix.target }}
          path: ~/.cargo/registry
      - name: Sticky disk - cargo git
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-cargo-git-${{ matrix.target }}
          path: ~/.cargo/git
      - name: Sticky disk - target
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-cargo-target-release-${{ matrix.target }}
          path: target
      - name: Build
        run: cargo build --release --locked -p invar --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          name="invar_${{ matrix.archive }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/invar" "dist/${name}/"
          cp LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: invar_${{ matrix.archive }}
          path: dist/invar_${{ matrix.archive }}.tar.gz
          if-no-files-found: error

  image:
    name: image (linux/amd64, linux/arm64)
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write # push to GHCR with GITHUB_TOKEN, as in release.yml
      id-token: write # keyless Cosign signing via GitHub OIDC
    steps:
      - uses: useblacksmith/checkout@v1
      - name: Download Linux binaries
        uses: actions/download-artifact@v7
        with:
          pattern: invar_Linux_*
          path: artifacts
      # Dockerfile copies $TARGETPLATFORM/invar (e.g. linux/amd64/invar).
      - name: Stage Docker build context
        run: |
          set -euo pipefail
          for pair in "Linux_x86_64:linux/amd64" "Linux_arm64:linux/arm64"; do
            archive="${pair%%:*}"
            platform="${pair#*:}"
            mkdir -p "ctx/${platform}"
            tar -xzf "artifacts/invar_${archive}/invar_${archive}.tar.gz" \
              -C "ctx/${platform}" --strip-components=1 "invar_${archive}/invar"
          done
          cp Dockerfile ctx/Dockerfile
          find ctx -type f
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Build and push
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: ctx
          file: ctx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/hardpointlabs/invar:sha-${{ github.sha }}
            docker.io/hardpointlabs/invar:sha-${{ github.sha }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      # The digest is that of the multi-arch index, identical in both registries.
      - name: Sign images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes \
            "ghcr.io/hardpointlabs/invar@${DIGEST}" \
            "docker.io/hardpointlabs/invar@${DIGEST}"
