name: CI

on:
  pull_request:
    branches: [master]

jobs:
  commit_messages:
    # Enforces Conventional Commits (for git-cliff) on every non-merge commit in
    # the PR. GitHub's "Merge pull request" commits aren't checked, so merging
    # is unaffected. Mark this job as a required check on master.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
      - name: Check commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::Commit $sha has a non-conventional subject"
              fail=1
            fi
          done
          exit $fail
  # Advisory-only: transitive deps can be flagged faster than upstream can ship
  # fixes (e.g. zstd via slatedb/foyer), so this must not block PRs.
  audit:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    continue-on-error: true
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
  test:
    # This is a required check, so it can't be filtered with `on.paths` (a
    # skipped workflow leaves the check pending forever). Instead it always
    # runs, but exits early (green) unless the PR touches something that can
    # change the binary or its tests; every later step is gated on `relevant`.
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 2 # the PR merge commit and its first parent (the base)
      - name: Detect relevant changes
        id: changes
        run: |
          # HEAD is the PR's merge commit; HEAD^1 is the base branch tip, so
          # this diff is exactly what the PR would change.
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          echo "Changed files:"
          sed 's/^/  /' "$RUNNER_TEMP/changed"
          # Anything that can alter the built binary, the unit tests, the
          # integration tests, or how they are run.
          if grep -qE '^(src/|test/|\.cargo/|Cargo\.toml$|Cargo\.lock$|build\.rs$|rust-toolchain(\.toml)?$|run-tests\.sh$|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No build- or test-relevant changes; skipping build and tests."
          fi
      - if: steps.changes.outputs.relevant == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false # use Blacksmith's caching instead
      - if: steps.changes.outputs.relevant == 'true'
        name: Sticky disk - cargo registry
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-cargo-registry
          path: ~/.cargo/registry
      - if: steps.changes.outputs.relevant == 'true'
        name: Sticky disk - cargo git
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-cargo-git
          path: ~/.cargo/git
      - if: steps.changes.outputs.relevant == 'true'
        name: Sticky disk - target
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-cargo-target
          path: target
      - if: steps.changes.outputs.relevant == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts
      - if: steps.changes.outputs.relevant == 'true'
        name: Build, unit tests, and integration tests
        run: |
          cargo clippy
          ./run-tests.sh
