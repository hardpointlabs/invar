name: CI

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: ./run-staticcheck.sh

      - name: Unit tests
        run: go test ./...

      - name: Integration tests
        run: ./run-tests.sh

  test-slatedb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build state
        uses: Swatinem/rust-cache@v2

      - name: Resolve SlateDB ref
        id: slatedb
        run: echo "ref=$(sed -n 's/^SLATEDB_REF[[:space:]]*:=[[:space:]]*//p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Cache SlateDB checkout and artifacts
        uses: actions/cache@v4
        with:
          path: .build/slatedb
          key: slatedb-${{ runner.os }}-${{ steps.slatedb.outputs.ref }}

      - name: Build SlateDB prerequisites
        run: make deps-slatedb

      - name: Run SlateDB-tagged tests
        run: make test
