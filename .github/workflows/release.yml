name: release
permissions:
  contents: write
  actions: write
  deployments: write
  packages: write

on:
  push:
    branches:
      - master

jobs:
  main:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    outputs:
      should_publish: ${{ steps.semantic.outputs.new_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Setup git auth
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/git
            @semantic-release/exec
            @semantic-release/changelog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Fetch tags
        if: steps.semantic.outputs.new_release == 'true'
        run: git fetch --force --tags
      - name: Login to GHCR
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
        if: steps.semantic.outputs.new_release == 'true'
      - name: Set up Rust toolchain
        if: steps.semantic.outputs.new_release == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build state
        if: steps.semantic.outputs.new_release == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Set up Zig
        if: steps.semantic.outputs.new_release == 'true'
        uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        if: steps.semantic.outputs.new_release == 'true'
        run: cargo install --locked cargo-zigbuild
      - name: Cache macOS SDK
        if: steps.semantic.outputs.new_release == 'true'
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/MacOSX11.3.sdk
          key: macos-sdk-11.3

      - name: Fetch macOS SDK
        if: steps.semantic.outputs.new_release == 'true' && steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -L "https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz" \
            | tar -J -x -C "${{ runner.temp }}"
      - name: Export SDKROOT
        run: echo "SDKROOT=${{ runner.temp }}/MacOSX11.3.sdk" >> "$GITHUB_ENV"
      - name: Run GoReleaser
        if: steps.semantic.outputs.new_release == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
          DISCORD_WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}