name: release
permissions:
  contents: write
  actions: write
  deployments: write
  packages: write

on:
  push:
    branches:
      - master

jobs:
  build-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cache Zig
        id: zig-cache
        uses: useblacksmith/stickydisk@v1
        with:
          path: ${{ runner.temp }}/zig
          key: zig-0.17.0-dev.1970
      - name: Install Zig
        run: |
          if [ ! -f "${{ runner.temp }}/zig/.stickydisk-installed" ]; then
            mkdir -p "${{ runner.temp }}/zig"
            curl -L "https://ziglang.org/builds/zig-aarch64-linux-0.17.0-dev.1970+67f39b551.tar.xz" \
              | tar -J -x --strip-components=1 -C "${{ runner.temp }}/zig"
            touch "${{ runner.temp }}/zig/.stickydisk-installed"
          fi
      - name: Add Zig to PATH
        run: echo "${{ runner.temp }}/zig" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild
      - name: Cache macOS SDK
        id: sdk-cache
        uses: useblacksmith/stickydisk@v1
        with:
          path: ${{ runner.temp }}/MacOSX11.3.sdk
          key: macos-sdk-11.3
      - name: Fetch macOS SDK
        run: |
          if [ ! -f "${{ runner.temp }}/MacOSX11.3.sdk/.stickydisk-installed" ]; then
            curl -L "https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz" \
              | tar -J -x -C "${{ runner.temp }}"
            touch "${{ runner.temp }}/MacOSX11.3.sdk/.stickydisk-installed"
          fi
      - name: Export SDKROOT
        run: echo "SDKROOT=${{ runner.temp }}/MacOSX11.3.sdk" >> "$GITHUB_ENV"
      - name: Sticky disk - cargo registry
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-cargo-registry
          path: ~/.cargo/registry
      - name: Sticky disk - cargo git
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-cargo-git
          path: ~/.cargo/git
      - name: Sticky disk - target
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-cargo-target
          path: target
      - name: GoReleaser build (validation only)
        uses: goreleaser/goreleaser-action@v7
        with:
          args: build --snapshot --clean
  main:
    needs: build-check
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    outputs:
      should_publish: ${{ steps.semantic.outputs.new_release }}
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            invar
            homebrew-tap
      - name: Setup git auth
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/git
            @semantic-release/exec
            @semantic-release/changelog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Fetch tags
        if: steps.semantic.outputs.new_release == 'true'
        run: git fetch --force --tags
      - name: Login to GHCR
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
        if: steps.semantic.outputs.new_release == 'true'
      - name: Set up Rust toolchain
        if: steps.semantic.outputs.new_release == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cache Zig
        if: steps.semantic.outputs.new_release == 'true'
        id: zig-cache
        uses: useblacksmith/stickydisk@v1
        with:
          path: ${{ runner.temp }}/zig
          key: zig-0.17.0-dev.1970
      - name: Install Zig
        if: steps.semantic.outputs.new_release == 'true'
        run: |
          if [ ! -f "${{ runner.temp }}/zig/.stickydisk-installed" ]; then
            mkdir -p "${{ runner.temp }}/zig"
            curl -L "https://ziglang.org/builds/zig-aarch64-linux-0.17.0-dev.1970+67f39b551.tar.xz" \
              | tar -J -x --strip-components=1 -C "${{ runner.temp }}/zig"
            touch "${{ runner.temp }}/zig/.stickydisk-installed"
          fi
      - name: Add Zig to PATH
        if: steps.semantic.outputs.new_release == 'true'
        run: echo "${{ runner.temp }}/zig" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        if: steps.semantic.outputs.new_release == 'true'
        run: cargo install --locked cargo-zigbuild
      - name: Cache macOS SDK
        if: steps.semantic.outputs.new_release == 'true'
        id: sdk-cache
        uses: useblacksmith/stickydisk@v1
        with:
          path: ${{ runner.temp }}/MacOSX11.3.sdk
          key: macos-sdk-11.3
      - name: Fetch macOS SDK
        if: steps.semantic.outputs.new_release == 'true'
        run: |
          if [ ! -f "${{ runner.temp }}/MacOSX11.3.sdk/.stickydisk-installed" ]; then
            curl -L "https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz" \
              | tar -J -x -C "${{ runner.temp }}"
            touch "${{ runner.temp }}/MacOSX11.3.sdk/.stickydisk-installed"
          fi
      - name: Export SDKROOT
        run: echo "SDKROOT=${{ runner.temp }}/MacOSX11.3.sdk" >> "$GITHUB_ENV"
      - name: Sticky disk - cargo registry
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-cargo-registry
          path: ~/.cargo/registry
      - name: Sticky disk - cargo git
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-cargo-git
          path: ~/.cargo/git
      - name: Sticky disk - target
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-cargo-target
          path: target
      - name: Run GoReleaser
        if: steps.semantic.outputs.new_release == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DISCORD_WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
          DISCORD_WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}