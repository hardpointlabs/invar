name: release
permissions:
  contents: write
  actions: write
  deployments: write
  packages: write

on:
  push:
    branches:
      - master

jobs:
  main:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.semantic.outputs.new_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup git auth
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/git
            @semantic-release/exec
            @semantic-release/changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch tags
        if: steps.semantic.outputs.new_release == 'true'
        run: git fetch --force --tags
      - name: Login to GHCR
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU
        if: steps.semantic.outputs.new_release == 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Go
        if: steps.semantic.outputs.new_release == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Set up Rust toolchain
        if: steps.semantic.outputs.new_release == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build state
        if: steps.semantic.outputs.new_release == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".build/slatedb"
      - name: Resolve SlateDB ref
        id: slatedb
        if: steps.semantic.outputs.new_release == 'true'
        run: echo "ref=$(sed -n 's/^SLATEDB_REF[[:space:]]*:=[[:space:]]*//p' Makefile)" >> "$GITHUB_OUTPUT"
      - name: Cache SlateDB checkout and artifacts
        if: steps.semantic.outputs.new_release == 'true'
        uses: actions/cache@v4
        with:
          path: .build/slatedb
          key: slatedb-${{ runner.os }}-${{ steps.slatedb.outputs.ref }}
      - name: Install aarch64 cross compiler
        if: steps.semantic.outputs.new_release == 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build SlateDB prerequisites and stage runtime libraries
        if: steps.semantic.outputs.new_release == 'true'
        run: make stage-goreleaser-assets
      - name: Run GoReleaser
        if: steps.semantic.outputs.new_release == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
