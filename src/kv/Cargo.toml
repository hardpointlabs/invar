[package]
name = "kv"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
async-trait = "0.1"
fjall = "3.1"
foyer = "0.22"
futures = "0.3"
metrics = "0.24"
object_store = "0.14"
slatedb = { version = "0.18.1", features = ["aws", "foyer", "zstd"] }
slatedb-common = "0.18.1"
thiserror = "2.0.20"
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1.44"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
